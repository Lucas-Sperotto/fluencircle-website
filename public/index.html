<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluenCircle</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <!-- Cabeçalho e menu (js/ui/app-shell.js) carregam primeiro: não dependem do Firebase. -->
    <script type="module" src="js/ui/app-shell.js"></script>
    <script type="module" src="js/pages/home.page.js"></script>
</head>
<body data-shell="app" data-page="home">
    <main id="home-page">
        <div class="content home-content">
            <div class="welcome-section">
                <h1>Bem-vindo ao <span class="highlight">FluenCircle</span></h1>
                <p class="welcome-subtitle">Você aprendeu português falando</p>

                <!-- Atalhos: "mediator-access" fica oculto para alunos (ver app-shell.js). -->
                <nav class="home-page-options" aria-label="Atalhos">
                    <a class="home-btn" id="home-flash-cards" href="flash-cards.html">
                        <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
                        Flash Cards
                    </a>
                    <a class="home-btn home-btn-secondary mediator-access hidden" id="home-start-meeting" href="presentation.html">
                        <i class="fa-solid fa-play" aria-hidden="true"></i>
                        Iniciar sessão
                    </a>
                    <a class="home-btn home-btn-secondary mediator-access hidden" id="home-set-meeting" href="set-meeting.html">
                        <i class="fa-solid fa-calendar-plus" aria-hidden="true"></i>
                        Temas
                    </a>
                </nav>
            </div>
        </div>
    </main>
</body>
</html>
