name: PR2 - importar os 8 commits originais Claude no fork
on:
  push:
    branches: [audit/pr2-upstream-transport]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar e importar bundle (sem tocar main)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/fluencircle/fluencircle-website.git main
          git cat-file -e da51788186261d3c013770ab9dae6a9ebbd8ce9f^{commit}
          git bundle verify transport/pr2-claude-original.bundle
          git fetch transport/pr2-claude-original.bundle refs/heads/feat/planos-agenda-pr2:refs/remotes/claude/pr2
          test "$(git rev-parse refs/remotes/claude/pr2)" = "3e71fc959827c40f15f9f688dcf471edd03333b1"
          test "$(git rev-list --count da51788186261d3c013770ab9dae6a9ebbd8ce9f..3e71fc959827c40f15f9f688dcf471edd03333b1)" = "8"
          git merge-base --is-ancestor da51788186261d3c013770ab9dae6a9ebbd8ce9f 3e71fc959827c40f15f9f688dcf471edd03333b1
          git push origin 3e71fc959827c40f15f9f688dcf471edd03333b1:refs/heads/feat/planos-agenda-pr2
          echo "Exatos 8 commits Claude preservados na branch PR2, main intocada."
