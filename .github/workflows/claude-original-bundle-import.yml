name: Import original Claude Git bundle (no merge/deploy)
on:
  push:
    branches: [audit/claude-bundle-import]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history (includes exact baseline)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify original bundle and import exact SHA history
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tmp/claude.bundle.b64 > /tmp/fluencircle-claude.bundle
          printf '%s  %s\n' '1c0e561bb00105c444a2f6a538e5fba32b8e7264a814b09a96f2b2b59462ed05' '/tmp/fluencircle-claude.bundle' | sha256sum -c -
          git cat-file -e '5d0180cf34839544c3c9cbc9307133612fddd3f7^{commit}'
          git bundle verify /tmp/fluencircle-claude.bundle
          git fetch /tmp/fluencircle-claude.bundle '+refs/heads/*:refs/remotes/claude-packet/*'
          for spec in \
            'claude/emulador-regras:6cf336b94822b12804a4bce9c2d0d1e03e7a7fa8' \
            'claude/e2e-perfis:e2f65e656e15269cc2b9927593eaeafbcbb30491' \
            'claude/concorrencia-sessao-ativa:192a9ef38e60bfee43d2d0f9a9f156ec270609a0' \
            'claude/privacidade-leituras:fa7a7e5ca16e09fe620edaf0dfc73d19bf2d521b' \
            'claude/tradutor-contas-backend:f98048ead7e2d7550f96dfbc7fb926d1e9b14bc6' \
            'feat/claude-hardening-entrega:1c64679f03d22dd29a817fae2da6fded41f5ce7f'
          do
            branch="${spec%%:*}"
            sha="${spec#*:}"
            actual="$(git rev-parse "refs/remotes/claude-packet/$branch")"
            test "$actual" = "$sha"
            git merge-base --is-ancestor 5d0180cf34839544c3c9cbc9307133612fddd3f7 "$sha"
            printf 'Validated %s -> %s\n' "$branch" "$sha"
          done
      - name: Transfer original Git objects for connector-authorized ref creation
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_TOKEN may not create workflow-changing branches; this push
          # transfers the pack for subsequent authorized GitHub connector refs.
          # Its rejection MUST be recorded rather than reported as successful.
          if git push origin 'refs/remotes/claude-packet/feat/claude-hardening-entrega:refs/heads/claude-import-object-transfer'; then
            echo 'Transfer ref published by runner; no merge.'
          else
            echo 'EXPECTED TOKEN SCOPE LIMIT: workflow-file modification blocked ref creation.'
            echo 'Original commits must be verified and published by the connected authorized GitHub client.'
          fi
